<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="About Karan Kumar — Developer Profile &amp; Life Outside Code">
  <title>About Karan Kumar — Developer Profile &amp; Life Outside Code</title>
  <defs>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fu { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
      text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>

    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#0b0e1b"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="borderGradRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="cardDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- ==================== LEFT CARD: DEVELOPER PROFILE ==================== -->
  <g transform="translate(0, 0)">
    <!-- Base Card -->
    <rect x="0" y="0" width="620" height="500" rx="20" fill="url(#panelBg)"/>
    <rect x="0" y="0" width="620" height="500" rx="20" fill="url(#cardDots)"/>
    <rect x="0.75" y="0.75" width="618.5" height="498.5" rx="19.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <g transform="translate(36, 40)">
      <text class="fu" x="0" y="0" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="2">// DEVELOPER PROFILE</text>
      <text class="fu bold-title" x="0" y="32" font-size="24" fill="#f8fafc">Building Real-World Systems</text>
      <text class="fu sans-font" x="0" y="58" font-size="14" fill="#94a3b8">B.Tech student building production-ready apps with Node.js &amp; Python.</text>

      <!-- Focus Grid Header -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e243d"/>
        <text x="12" y="16" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1">CURRENTLY FOCUSING ON</text>
      </g>

      <!-- Focus 1: Full-Stack Development -->
      <g class="fu" transform="translate(0, 120)" style="animation-delay: 0.15s;">
        <rect x="0" y="0" width="548" height="64" rx="12" fill="#161b32" stroke="#252c4a"/>
        <rect x="12" y="12" width="40" height="40" rx="10" fill="#38bdf8" fill-opacity="0.12"/>
        <path d="M22 36L32 40L42 36M22 31L32 35L42 31M32 22L22 26L32 30L42 26L32 22Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -6)"/>
        <text class="bold-title" x="64" y="27" font-size="15" fill="#f1f5f9">Full-Stack Development</text>
        <text class="sans-font" x="64" y="47" font-size="12.5" fill="#94a3b8">Scalable backends with Node.js, Express, React, PostgreSQL &amp; Firebase</text>
      </g>

      <!-- Focus 2: Python Backend -->
      <g class="fu" transform="translate(0, 196)" style="animation-delay: 0.3s;">
        <rect x="0" y="0" width="548" height="64" rx="12" fill="#161b32" stroke="#252c4a"/>
        <rect x="12" y="12" width="40" height="40" rx="10" fill="#818cf8" fill-opacity="0.12"/>
        <circle cx="32" cy="32" r="12" fill="none" stroke="#818cf8" stroke-width="1.8"/>
        <text x="32" y="36" font-size="11" fill="#818cf8" font-weight="700" text-anchor="middle">PY</text>
        <text class="bold-title" x="64" y="27" font-size="15" fill="#f1f5f9">Python Backend Development</text>
        <text class="sans-font" x="64" y="47" font-size="12.5" fill="#94a3b8">RESTful APIs, web automation, data pipelines &amp; server architecture</text>
      </g>

