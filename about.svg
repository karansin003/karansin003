        <rect x="0" y="0" width="548" height="64" rx="12" fill="#161b32" stroke="#252c4a"/>
        <rect x="12" y="12" width="40" height="40" rx="10" fill="#a855f7" fill-opacity="0.12"/>
        <circle cx="32" cy="32" r="5" fill="none" stroke="#a855f7" stroke-width="2"/>
        <circle cx="23" cy="26" r="2" fill="#a855f7"/>
        <circle cx="41" cy="26" r="2" fill="#a855f7"/>
        <circle cx="26" cy="38" r="2" fill="#a855f7"/>
        <circle cx="38" cy="38" r="2" fill="#a855f7"/>
        <line x1="25" y1="27" x2="30" y2="30" stroke="#a855f7" stroke-width="1.2"/>
        <line x1="39" y1="27" x2="34" y2="30" stroke="#a855f7" stroke-width="1.2"/>
        <line x1="28" y1="37" x2="30" y2="34" stroke="#a855f7" stroke-width="1.2"/>
        <line x1="36" y1="37" x2="34" y2="34" stroke="#a855f7" stroke-width="1.2"/>
        <text class="bold-title" x="64" y="27" font-size="15" fill="#f1f5f9">AI &amp; Machine Learning</text>
        <text class="sans-font" x="64" y="47" font-size="12.5" fill="#94a3b8">Applied models &amp; analytics with NumPy, Pandas, Scikit-learn</text>
      </g>

