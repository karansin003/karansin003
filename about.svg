        <rect x="14" y="14" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.12"/>
        <text x="37" y="42" font-size="20" text-anchor="middle">🧩</text>
        <text class="bold-title" x="72" y="32" font-size="16" fill="#f1f5f9">Problem Solving</text>
        <text class="sans-font" x="72" y="54" font-size="13" fill="#94a3b8">Algorithmic thinking, brain teasers, strategy games &amp; optimization</text>
      </g>

