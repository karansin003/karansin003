<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Developer Profile and Life Outside Code — Karan Kumar">
  <title>Developer Profile &amp; Life Outside Code — Karan Kumar</title>
  <defs>
