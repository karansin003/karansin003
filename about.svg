        <rect x="0" y="0" width="548" height="74" rx="14" fill="#161b32" stroke="#252a45"/>
        <rect x="14" y="14" width="46" height="46" rx="12" fill="#34d399" fill-opacity="0.12"/>
        <text x="37" y="42" font-size="20" text-anchor="middle">🏏</text>
        <text class="bold-title" x="72" y="32" font-size="16" fill="#f1f5f9">Cricket</text>
        <text class="sans-font" x="72" y="54" font-size="13" fill="#94a3b8">Tactical gameplay, field focus, teamwork, endurance &amp; agility</text>
      </g>

      <!-- Hobby 3: Travelling -->
      <g class="fu" transform="translate(0, 276)" style="animation-delay: 0.45s;">
        <rect x="0" y="0" width="548" height="74" rx="14" fill="#161b32" stroke="#252a45"/>
        <rect x="14" y="14" width="46" height="46" rx="12" fill="#38bdf8" fill-opacity="0.12"/>
        <text x="37" y="42" font-size="20" text-anchor="middle">✈️</text>
        <text class="bold-title" x="72" y="32" font-size="16" fill="#f1f5f9">Travelling</text>
        <text class="sans-font" x="72" y="54" font-size="13" fill="#94a3b8">Exploring new destinations, mountain horizons &amp; cultural perspectives</text>
      </g>

      <!-- Focus Rings: Daily Principles -->
      <g class="fu" transform="translate(0, 366)" style="animation-delay: 0.6s;">
        <rect x="0" y="0" width="548" height="54" rx="12" fill="#101322" stroke="#21263d"/>
        <g transform="translate(24, 32)">
          <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
          <text class="bold-title" x="12" y="4" font-size="13" fill="#f1f5f9">Code</text>
        </g>
        <g transform="translate(160, 32)">
          <circle cx="0" cy="0" r="4" fill="#818cf8"/>
          <text class="bold-title" x="12" y="4" font-size="13" fill="#f1f5f9">Learn</text>
        </g>
        <g transform="translate(290, 32)">
          <circle cx="0" cy="0" r="4" fill="#34d399"/>
          <text class="bold-title" x="12" y="4" font-size="13" fill="#f1f5f9">Build</text>
        </g>
        <g transform="translate(420, 32)">
          <circle cx="0" cy="0" r="4" fill="#c084fc"/>
