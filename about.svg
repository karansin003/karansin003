      <g class="fu" transform="translate(0, 348)" style="animation-delay: 0.6s;">
        <rect x="0" y="0" width="548" height="64" rx="12" fill="#161b32" stroke="#252c4a"/>
        <rect x="12" y="12" width="40" height="40" rx="10" fill="#f59e0b" fill-opacity="0.12"/>
        <circle cx="32" cy="24" r="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="24" cy="40" r="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="40" cy="40" r="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <line x1="30" y1="26" x2="25" y2="38" stroke="#f59e0b" stroke-width="1.5"/>
        <line x1="34" y1="26" x2="39" y2="38" stroke="#f59e0b" stroke-width="1.5"/>
        <text class="bold-title" x="64" y="27" font-size="15" fill="#f1f5f9">Java DSA / Problem Solving</text>
        <text class="sans-font" x="64" y="47" font-size="12.5" fill="#94a3b8">Data Structures, Algorithms, LeetCode &amp; optimized complexity</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: LIFE OUTSIDE CODE ==================== -->
  <g transform="translate(660, 0)">
    <!-- Base Card -->
