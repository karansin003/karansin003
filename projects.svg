<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Featured Engineering Projects — Karan Kumar">
  <title>Featured Engineering Projects — Karan Kumar</title>
  <defs>
    <style>
      @keyframes cardGlowPulse {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 0.85; }
      }
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .glow-border { animation: cardGlowPulse 4s ease-in-out infinite; }
      .icon-float { animation: floatIcon 3s ease-in-out infinite; }
      text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>

    <linearGradient id="projCanvasBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1022"/>
      <stop offset="60%" stop-color="#080b18"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <linearGradient id="projCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121730" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0d1c" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="projOuterGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardBorder1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d2645" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardBorder2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d2645" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardBorder3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d2645" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardBorder4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d2645" stop-opacity="0.3"/>
    </linearGradient>

    <pattern id="matrixDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="projClip">
      <rect width="1280" height="640" rx="24"/>
    </clipPath>
