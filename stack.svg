<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="Tech Stack — Karan Kumar">
  <title>Tech Stack — Karan Kumar</title>
  <defs>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes orbitA {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitB {
        0% { transform: rotate(120deg); }
        100% { transform: rotate(480deg); }
      }
      @keyframes orbitC {
        0% { transform: rotate(240deg); }
        100% { transform: rotate(600deg); }
      }
      @keyframes pulseChip {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.85; }
      }
      .fu { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .orb-rotA { transform-origin: 235px 310px; animation: orbitA 20s linear infinite; }
      .orb-rotB { transform-origin: 235px 310px; animation: orbitB 26s linear infinite; }
      .orb-rotC { transform-origin: 235px 310px; animation: orbitC 32s linear infinite; }
      .chip-pulse { animation: pulseChip 4s ease-in-out infinite; }
      text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>

    <linearGradient id="stackCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121528"/>
      <stop offset="100%" stop-color="#0d0f1c"/>
    </linearGradient>

    <linearGradient id="stackBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="atomGlow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stackDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1280" height="570" rx="24" fill="url(#stackCardBg)"/>
  <rect width="1280" height="570" rx="24" fill="url(#stackDots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="568.5" rx="23.25" fill="none" stroke="url(#stackBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g class="fu" transform="translate(48, 44)">
    <text x="0" y="0" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="2">// TECH STACK &amp; TOOLING</text>
    <text class="bold-title" x="0" y="32" font-size="28" fill="#f8fafc">Technologies &amp; Libraries</text>
  </g>

  <!-- Dividing Column Line -->
  <line x1="470" y1="100" x2="470" y2="520" stroke="#21263d" stroke-width="1.2"/>

  <!-- ==================== LEFT: ATOM / LOGIC ORBIT REACTOR ==================== -->
  <g transform="translate(235, 310)">
    <!-- Radial Ambient Glow -->
    <circle r="140" fill="url(#atomGlow)"/>

    <!-- Orbital Rings -->
    <ellipse rx="155" ry="62" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(0)"/>
    <ellipse rx="155" ry="62" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse rx="155" ry="62" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(120)"/>

    <!-- Central Reactor Nucleus -->
    <circle r="36" fill="#151b32" stroke="#38bdf8" stroke-width="2"/>
    <text class="bold-title" x="0" y="7" font-size="18" fill="#38bdf8" text-anchor="middle">&lt; / &gt;</text>

    <!-- Orbiting Satellite 1: Node.js (Primary Dev) -->
    <g class="orb-rotA" transform="translate(0, 0)">
      <g transform="translate(155, 0)">
        <circle r="17" fill="#151b32" stroke="#22c55e" stroke-width="1.5"/>
        <text class="bold-title" x="0" y="4.5" font-size="10" fill="#22c55e" text-anchor="middle">NODE</text>
      </g>
    </g>

    <!-- Orbiting Satellite 2: Python (Dev & AI/ML) -->
    <g class="orb-rotB" transform="translate(0, 0)">
      <g transform="translate(155, 0)">
        <circle r="17" fill="#151b32" stroke="#38bdf8" stroke-width="1.5"/>
        <text class="bold-title" x="0" y="4.5" font-size="10" fill="#38bdf8" text-anchor="middle">PY</text>
      </g>
    </g>

    <!-- Orbiting Satellite 3: Java (DSA / Algorithms) -->
    <g class="orb-rotC" transform="translate(0, 0)">
      <g transform="translate(155, 0)">
        <circle r="17" fill="#151b32" stroke="#f59e0b" stroke-width="1.5"/>
        <text class="bold-title" x="0" y="4.5" font-size="10" fill="#f59e0b" text-anchor="middle">DSA</text>
      </g>
    </g>

    <!-- Bottom Caption inside left panel -->
    <text x="0" y="150" font-size="12" fill="#64748b" text-anchor="middle">Node.js · Python · Java DSA</text>
  </g>

  <!-- ==================== RIGHT: CATEGORIZED CHIP GRID ==================== -->
  <g transform="translate(500, 100)">
    <!-- 1. LANGUAGES -->
    <g class="fu" transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#38bdf8"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">CORE LANGUAGES</text>

      <g transform="translate(0, 18)">
        <!-- C -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="60" height="34" rx="9" fill="#181e35" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <text class="sans-font" x="30" y="22" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">C</text>
        </g>
        <!-- C++ -->
        <g transform="translate(72, 0)">
          <rect x="0" y="0" width="76" height="34" rx="9" fill="#181e35" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <text class="sans-font" x="38" y="22" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">C++</text>
        </g>
        <!-- Java (DSA & Problem Solving) -->
        <g transform="translate(160, 0)">
          <rect x="0" y="0" width="180" height="34" rx="9" fill="#181e35" stroke="#f59e0b" stroke-width="1.2" class="chip-pulse"/>
          <circle cx="16" cy="17" r="4" fill="#f59e0b"/>
          <text class="sans-font" x="28" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9">Java (DSA &amp; Algo)</text>
        </g>
        <!-- Python -->
        <g transform="translate(352, 0)">
          <rect x="0" y="0" width="108" height="34" rx="9" fill="#181e35" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
          <text class="sans-font" x="28" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9">Python</text>
        </g>
      </g>
    </g>

    <!-- 2. FRONTEND -->
    <g class="fu" transform="translate(0, 80)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#818cf8"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">FRONTEND</text>

      <g transform="translate(0, 18)">
        <!-- HTML5 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="82" height="34" rx="9" fill="#181e35" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6"/>
          <text class="sans-font" x="41" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">HTML</text>
        </g>
        <!-- CSS3 -->
        <g transform="translate(94, 0)">
          <rect x="0" y="0" width="76" height="34" rx="9" fill="#181e35" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
          <text class="sans-font" x="38" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">CSS</text>
        </g>
        <!-- JavaScript -->
        <g transform="translate(182, 0)">
          <rect x="0" y="0" width="115" height="34" rx="9" fill="#181e35" stroke="#eab308" stroke-width="1.2" stroke-opacity="0.6"/>
          <text class="sans-font" x="57.5" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">JavaScript</text>
        </g>
        <!-- React -->
        <g transform="translate(309, 0)">
          <rect x="0" y="0" width="90" height="34" rx="9" fill="#181e35" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
          <text class="sans-font" x="45" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">React</text>
        </g>
      </g>
    </g>

    <!-- 3. BACKEND & DATABASES -->
    <g class="fu" transform="translate(0, 160)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#34d399"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">BACKEND &amp; DATABASES</text>

      <!-- Row 1: Frameworks -->
      <g transform="translate(0, 18)">
        <!-- Node.js -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="92" height="34" rx="9" fill="#181e35" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="46" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Node.js</text>
        </g>
        <!-- Express.js -->
        <g transform="translate(104, 0)">
          <rect x="0" y="0" width="105" height="34" rx="9" fill="#181e35" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="52.5" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Express.js</text>
        </g>
        <!-- Django -->
        <g transform="translate(221, 0)">
          <rect x="0" y="0" width="88" height="34" rx="9" fill="#181e35" stroke="#047857" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="44" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Django</text>
        </g>
        <!-- Spring Boot -->
        <g transform="translate(321, 0)">
          <rect x="0" y="0" width="118" height="34" rx="9" fill="#181e35" stroke="#16a34a" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="59" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Spring Boot</text>
        </g>
      </g>

      <!-- Row 2: Databases -->
      <g transform="translate(0, 58)">
        <!-- PostgreSQL -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="115" height="34" rx="9" fill="#181e35" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="57.5" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">PostgreSQL</text>
        </g>
        <!-- MySQL -->
        <g transform="translate(127, 0)">
          <rect x="0" y="0" width="84" height="34" rx="9" fill="#181e35" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="42" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">MySQL</text>
        </g>
        <!-- MongoDB -->
        <g transform="translate(223, 0)">
          <rect x="0" y="0" width="100" height="34" rx="9" fill="#181e35" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="50" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">MongoDB</text>
        </g>
      </g>
    </g>

    <!-- 4. AI/ML & DEV TOOLS -->
    <g class="fu" transform="translate(0, 276)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#f59e0b"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">AI/ML &amp; DEVELOPER TOOLS</text>

      <!-- Row 1: AI/ML -->
      <g transform="translate(0, 18)">
        <!-- NumPy -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="84" height="34" rx="9" fill="#181e35" stroke="#4f46e5" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="42" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">NumPy</text>
        </g>
        <!-- Pandas -->
        <g transform="translate(96, 0)">
          <rect x="0" y="0" width="86" height="34" rx="9" fill="#181e35" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="43" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Pandas</text>
        </g>
        <!-- Scikit-learn -->
        <g transform="translate(194, 0)">
          <rect x="0" y="0" width="120" height="34" rx="9" fill="#181e35" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="60" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Scikit-learn</text>
        </g>
      </g>

      <!-- Row 2: Tools -->
      <g transform="translate(0, 58)">
        <!-- Git & GitHub -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="122" height="34" rx="9" fill="#181e35" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="61" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Git / GitHub</text>
        </g>
        <!-- VS Code -->
        <g transform="translate(134, 0)">
          <rect x="0" y="0" width="94" height="34" rx="9" fill="#181e35" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="47" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">VS Code</text>
        </g>
        <!-- Antigravity -->
        <g transform="translate(240, 0)">
          <rect x="0" y="0" width="112" height="34" rx="9" fill="#181e35" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="56" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Antigravity</text>
        </g>
        <!-- Codex -->
        <g transform="translate(364, 0)">
          <rect x="0" y="0" width="84" height="34" rx="9" fill="#181e35" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="42" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Codex</text>
        </g>
      </g>
    </g>

    <!-- 5. CURRENTLY LEARNING BADGE -->
    <g class="fu" transform="translate(0, 396)">
      <rect x="0" y="0" width="460" height="34" rx="9" fill="#1e2238" stroke="#333856" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#38bdf8"/>
      <text x="28" y="22" font-size="11.5" fill="#94a3b8">Currently Learning: <tspan fill="#f1f5f9" font-weight="600">Java DSA</tspan> &amp; <tspan fill="#f1f5f9" font-weight="600">Python Backend Development</tspan></text>
    </g>
  </g>
</svg>