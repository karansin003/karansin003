<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Tech Stack &amp; Tooling Orbit — Karan Kumar">
  <title>Tech Stack &amp; Tooling Orbit — Karan Kumar</title>
  <defs>
    <style>
      @keyframes fadeUp {
        from {{ opacity: 0; transform: translateY(12px); }}
        to {{ opacity: 1; transform: translateY(0); }}
      }}
      @keyframes orbitA {
        0% {{ transform: rotate(0deg); }}
        100% {{ transform: rotate(360deg); }}
      }}
      @keyframes orbitB {
        0% {{ transform: rotate(120deg); }}
        100% {{ transform: rotate(480deg); }}
      }}
      @keyframes orbitC {
        0% {{ transform: rotate(240deg); }}
        100% {{ transform: rotate(600deg); }}
      }}
      @keyframes pulseChip {
        0%, 100% {{ stroke-opacity: 0.3; }}
        50% {{ stroke-opacity: 0.9; }}
      }}
      @keyframes coreGlow {
        0%, 100% {{ r: 36px; stroke-opacity: 0.8; }}
        50% {{ r: 40px; stroke-opacity: 1; }}
      }}
      .fu {{ animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }}
      .orb-rotA {{ transform-origin: 225px 330px; animation: orbitA 20s linear infinite; }}
      .orb-rotB {{ transform-origin: 225px 330px; animation: orbitB 26s linear infinite; }}
      .orb-rotC {{ transform-origin: 225px 330px; animation: orbitC 32s linear infinite; }}
      .chip-pulse {{ animation: pulseChip 4s ease-in-out infinite; }}
      text {{ font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }}
      .sans-font {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }}
      .bold-title {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }}
    </style>

    <linearGradient id="stackCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11152a"/>
      <stop offset="100%" stop-color="#080a14"/>
    </linearGradient>

    <linearGradient id="stackBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#262a42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="atomGlow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stackDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1280" height="620" rx="24" fill="url(#stackCardBg)"/>
  <rect width="1280" height="620" rx="24" fill="url(#stackDots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="618.5" rx="23.25" fill="none" stroke="url(#stackBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g class="fu" transform="translate(48, 44)">
    <text x="0" y="0" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="2">// TECH STACK ORBIT</text>
    <text class="bold-title" x="0" y="32" font-size="28" fill="#f8fafc">Technologies, Frameworks &amp; Tooling</text>
  </g>

  <!-- Dividing Line -->
  <line x1="460" y1="105" x2="460" y2="570" stroke="#1e2540" stroke-width="1.2"/>

  <!-- ==================== LEFT: ATOM / LOGIC ORBIT REACTOR ==================== -->
  <g transform="translate(225, 330)">
    <circle r="150" fill="url(#atomGlow)"/>

    <!-- Orbital Rings -->
    <ellipse rx="165" ry="66" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(0)"/>
    <ellipse rx="165" ry="66" fill="none" stroke="#818cf8" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse rx="165" ry="66" fill="none" stroke="#34d399" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(120)"/>

    <!-- Central Reactor Nucleus -->
    <circle r="40" fill="#151b32" stroke="#38bdf8" stroke-width="2.2"/>
    <circle r="48" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <text class="bold-title" x="0" y="6" font-size="14.5" fill="#38bdf8" text-anchor="middle">&lt; CODE /&gt;</text>

    <!-- Orbiting Satellite 1: Node.js (Primary Dev) -->
    <g class="orb-rotA" transform="translate(0, 0)">
      <g transform="translate(165, 0)">
        <circle r="18" fill="#151b32" stroke="#22c55e" stroke-width="1.8"/>
        <text class="bold-title" x="0" y="4.5" font-size="9.5" fill="#22c55e" text-anchor="middle">NODE</text>
      </g>
    </g>

    <!-- Orbiting Satellite 2: Python (Dev & AI/ML) -->
    <g class="orb-rotB" transform="translate(0, 0)">
      <g transform="translate(165, 0)">
        <circle r="18" fill="#151b32" stroke="#38bdf8" stroke-width="1.8"/>
        <text class="bold-title" x="0" y="4.5" font-size="9.5" fill="#38bdf8" text-anchor="middle">PY</text>
      </g>
    </g>

    <!-- Orbiting Satellite 3: Java DSA (Algorithms) -->
    <g class="orb-rotC" transform="translate(0, 0)">
      <g transform="translate(165, 0)">
        <circle r="18" fill="#151b32" stroke="#f59e0b" stroke-width="1.8"/>
        <text class="bold-title" x="0" y="4.5" font-size="9.5" fill="#f59e0b" text-anchor="middle">DSA</text>
      </g>
    </g>

    <!-- Bottom Caption inside left panel -->
    <text x="0" y="180" font-size="11.5" fill="#64748b" text-anchor="middle">Node.js · Python · Java DSA · React</text>
  </g>

  <!-- ==================== RIGHT: 6 CATEGORIZED TECHNOLOGY SECTIONS ==================== -->
  <g transform="translate(490, 105)">
    <!-- 1. LANGUAGES -->
    <g class="fu" transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#38bdf8"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">LANGUAGES</text>

      <g transform="translate(0, 16)">
        <!-- C -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="62" height="34" rx="9" fill="#171d36" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <text class="sans-font" x="31" y="22" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">C</text>
        </g>
        <!-- C++ -->
        <g transform="translate(74, 0)">
          <rect x="0" y="0" width="76" height="34" rx="9" fill="#171d36" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <text class="sans-font" x="38" y="22" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">C++</text>
        </g>
        <!-- Java (DSA & Problem Solving) -->
        <g transform="translate(162, 0)">
          <rect x="0" y="0" width="180" height="34" rx="9" fill="#171d36" stroke="#f59e0b" stroke-width="1.2" class="chip-pulse"/>
          <circle cx="16" cy="17" r="4" fill="#f59e0b"/>
          <text class="sans-font" x="28" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9">Java (DSA &amp; Algo)</text>
        </g>
        <!-- Python -->
        <g transform="translate(354, 0)">
          <rect x="0" y="0" width="110" height="34" rx="9" fill="#171d36" stroke="#38bdf8" stroke-width="1.2" class="chip-pulse"/>
          <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
          <text class="sans-font" x="28" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9">Python</text>
        </g>
      </g>
    </g>

    <!-- 2. FRONTEND -->
    <g class="fu" transform="translate(0, 80)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#818cf8"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">FRONTEND</text>

      <g transform="translate(0, 16)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="86" height="34" rx="9" fill="#171d36" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="43" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">HTML5</text>
        </g>
        <g transform="translate(98, 0)">
          <rect x="0" y="0" width="80" height="34" rx="9" fill="#171d36" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="40" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">CSS3</text>
        </g>
        <g transform="translate(190, 0)">
          <rect x="0" y="0" width="122" height="34" rx="9" fill="#171d36" stroke="#eab308" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="61" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">JavaScript</text>
        </g>
        <g transform="translate(324, 0)">
          <rect x="0" y="0" width="92" height="34" rx="9" fill="#171d36" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="46" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">React</text>
        </g>
      </g>
    </g>

    <!-- 3. BACKEND -->
    <g class="fu" transform="translate(0, 160)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#22c55e"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">BACKEND</text>

      <g transform="translate(0, 16)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="94" height="34" rx="9" fill="#171d36" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="47" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Node.js</text>
        </g>
        <g transform="translate(106, 0)">
          <rect x="0" y="0" width="108" height="34" rx="9" fill="#171d36" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="54" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Express.js</text>
        </g>
        <g transform="translate(226, 0)">
          <rect x="0" y="0" width="90" height="34" rx="9" fill="#171d36" stroke="#047857" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="45" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Django</text>
        </g>
        <g transform="translate(328, 0)">
          <rect x="0" y="0" width="120" height="34" rx="9" fill="#171d36" stroke="#16a34a" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="60" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Spring Boot</text>
        </g>
      </g>
    </g>

    <!-- 4. DATABASE -->
    <g class="fu" transform="translate(0, 240)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#3b82f6"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">DATABASE</text>

      <g transform="translate(0, 16)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="122" height="34" rx="9" fill="#171d36" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="61" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">PostgreSQL</text>
        </g>
        <g transform="translate(134, 0)">
          <rect x="0" y="0" width="86" height="34" rx="9" fill="#171d36" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="43" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">MySQL</text>
        </g>
        <g transform="translate(232, 0)">
          <rect x="0" y="0" width="102" height="34" rx="9" fill="#171d36" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="51" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">MongoDB</text>
        </g>
      </g>
    </g>

    <!-- 5. AI / ML -->
    <g class="fu" transform="translate(0, 320)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#a855f7"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">AI / ML</text>

      <g transform="translate(0, 16)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="86" height="34" rx="9" fill="#171d36" stroke="#4f46e5" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="43" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">NumPy</text>
        </g>
        <g transform="translate(98, 0)">
          <rect x="0" y="0" width="88" height="34" rx="9" fill="#171d36" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="44" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Pandas</text>
        </g>
        <g transform="translate(198, 0)">
          <rect x="0" y="0" width="124" height="34" rx="9" fill="#171d36" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="62" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Scikit-learn</text>
        </g>
      </g>
    </g>

    <!-- 6. TOOLS -->
    <g class="fu" transform="translate(0, 400)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#f43f5e"/>
      <text x="20" y="6" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1.8">TOOLS</text>

      <g transform="translate(0, 16)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="70" height="34" rx="9" fill="#171d36" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="35" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Git</text>
        </g>
        <g transform="translate(82, 0)">
          <rect x="0" y="0" width="92" height="34" rx="9" fill="#171d36" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="46" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">GitHub</text>
        </g>
        <g transform="translate(186, 0)">
          <rect x="0" y="0" width="98" height="34" rx="9" fill="#171d36" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7"/>
          <text class="sans-font" x="49" y="22" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">VS Code</text>
        </g>
      </g>
    </g>
  </g>
</svg>